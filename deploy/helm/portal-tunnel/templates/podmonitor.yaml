{{- if .Values.metrics.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "portal-tunnel.fullname" . }}
  labels:
    {{- include "portal-tunnel.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "portal-tunnel.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.podMonitor.interval }}
{{- end }}
