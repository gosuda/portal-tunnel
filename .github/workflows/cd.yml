name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Container Images
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/gosuda/portal
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=true,prefix=sha-,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal

      - name: Extract tunnel image metadata
        id: tunnel_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/gosuda/portal-tunnel
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=true,prefix=sha-,suffix=,format=short

      - name: Build and push tunnel Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: cmd/portal-tunnel/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tunnel_meta.outputs.tags }}
          labels: ${{ steps.tunnel_meta.outputs.labels }}
          # CI builds this same Dockerfile on linux/amd64 (scope portal-tunnel-ci);
          # restore those layers instead of rebuilding them here.
          cache-from: |
            type=gha,scope=portal-tunnel
            type=gha,scope=portal-tunnel-ci
          cache-to: type=gha,mode=max,scope=portal-tunnel

  publish-charts:
    name: Publish Helm Charts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The chart version and appVersion both follow the release tag, so each
      # chart installs the images built from the same tag.
      - name: Package and push charts
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$REGISTRY_TOKEN" | helm registry login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
          for chart in docs/examples/helm/*/; do
            helm package "$chart" --version "$version" --app-version "$version" --destination dist/charts
          done
          for package in dist/charts/*.tgz; do
            helm push "$package" "oci://$REGISTRY/gosuda/charts"
          done

  release-binaries:
    name: Build and Release Tunnel Binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build tunnel binaries
        shell: bash
        run: |
          make build-tunnel
          mkdir -p release
          cp cmd/relay-server/dist/tunnel/portal-* release/
          cp cmd/relay-server/dist/tunnel/wasm_exec.js release/
          cp cmd/portal-tunnel/installer/install.sh release/install.sh
          cp cmd/portal-tunnel/installer/install.ps1 release/install.ps1

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release
          sha256sum portal-* wasm_exec.js > checksums.txt
          while read -r sum file; do
            printf '%s  %s\n' "$sum" "$file" > "${file}.sha256"
          done < checksums.txt

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi

  # Portal Desktop joins the release that release-binaries published, so a
  # desktop build that fails cannot hold back the CLI. Until its assets are
  # uploaded, the installers with --with-gui and portal update with a desktop
  # installed stop before they change anything.
  release-desktop:
    name: Build and Release Portal Desktop
    needs: release-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build desktop packages
        shell: bash
        run: |
          make install-ggui
          make build-desktop
          mkdir -p release
          cp bin/desktop/portal-desktop-* release/
          cd release
          for file in portal-desktop-*; do
            sha256sum "$file" > "${file}.sha256"
          done

      - name: Upload desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" release/* --clobber
