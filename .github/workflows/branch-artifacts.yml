name: Branch Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build. Leave empty to build the workflow branch.
        required: false

env:
  BUILD_REF: ${{ inputs.ref || github.ref_name }}
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: branch-artifacts-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Artifacts
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare artifact metadata
        id: meta
        shell: bash
        run: |
          safe_ref="$(printf '%s' "$BUILD_REF" | tr '[:upper:]' '[:lower:]' | tr '/:@' '---' | tr -cd 'a-z0-9._-')"
          if [ -z "$safe_ref" ]; then
            safe_ref="selected-ref"
          fi
          safe_ref="${safe_ref:0:80}"
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "safe_ref=$safe_ref" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "portal_image_tags<<EOF"
            echo "${REGISTRY}/gosuda/portal:branch-${safe_ref}"
            echo "${REGISTRY}/gosuda/portal:branch-${safe_ref}-${short_sha}"
            echo "EOF"
            echo "tunnel_image_tags<<EOF"
            echo "${REGISTRY}/gosuda/portal-tunnel:branch-${safe_ref}"
            echo "${REGISTRY}/gosuda/portal-tunnel:branch-${safe_ref}-${short_sha}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push portal Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.portal_image_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit_sha }}
            org.opencontainers.image.ref.name=${{ env.BUILD_REF }}
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal

      - name: Build and push tunnel Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: cmd/portal-tunnel/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tunnel_image_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit_sha }}
            org.opencontainers.image.ref.name=${{ env.BUILD_REF }}
          cache-from: type=gha,scope=portal-tunnel
          cache-to: type=gha,mode=max,scope=portal-tunnel

      - name: Build binaries
        shell: bash
        run: |
          mkdir -p release

          make build-frontend
          make build-tunnel
          cp cmd/relay-server/dist/tunnel/portal-* release/
          cp cmd/relay-server/dist/tunnel/wasm_exec.js release/

          for GOARCH in amd64 arm64; do
            out="release/relay-server-linux-${GOARCH}"
            echo " - ${out}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" go build -trimpath -ldflags "-s -w" -o "${out}" ./cmd/relay-server
          done

          cp cmd/portal-tunnel/installer/install.sh release/install.sh
          cp cmd/portal-tunnel/installer/install.ps1 release/install.ps1

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release
          sha256sum * > checksums.txt
          while read -r sum file; do
            printf '%s  %s\n' "$sum" "$file" > "${file}.sha256"
          done < checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portal-${{ steps.meta.outputs.safe_ref }}-${{ steps.meta.outputs.short_sha }}
          path: release/*
          if-no-files-found: error
