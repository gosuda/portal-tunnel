name: VS Code Extension

on:
  pull_request:
    branches: [main]
    paths:
      - "extensions/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  push:
    branches: [main]
    tags: ["extension-v*"]
    paths:
      - "extensions/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/extension-v') }}

jobs:
  package:
    name: Package extension
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: extensions/vscode/package.json
          cache: true
          cache_dependency_path: extensions/vscode/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run extension tests
        run: pnpm test

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/extension-v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="extension-v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            printf 'release tag %s does not match package version %s\n' "${GITHUB_REF_NAME}" "${version}" >&2
            exit 1
          fi

      - name: Package VSIX
        run: |
          mkdir -p release
          pnpm exec vsce package \
            --no-dependencies \
            --out release/portal-tunnel.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portal-tunnel-vsix
          path: extensions/vscode/release/portal-tunnel.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish extension
    if: startsWith(github.ref, 'refs/tags/extension-v')
    needs: package
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: extensions/vscode/package.json
          cache: true
          cache_dependency_path: extensions/vscode/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: portal-tunnel-vsix
          path: extensions/vscode/release

      - name: Publish to Visual Studio Marketplace
        run: |
          pnpm exec vsce publish \
            --packagePath release/portal-tunnel.vsix \
            --skip-duplicate \
            --oidc
