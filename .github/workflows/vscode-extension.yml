name: VS Code Extension

on:
  pull_request:
    branches: [main]
    paths:
      - "extensions/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  push:
    branches: [main]
    tags: ["extension-v*"]
    paths:
      - "extensions/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/extension-v') }}

jobs:
  package:
    name: Package extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run extension tests
        run: pnpm test

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/extension-v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="extension-v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            printf 'release tag %s does not match package version %s\n' "${GITHUB_REF_NAME}" "${version}" >&2
            exit 1
          fi

      - name: Package VSIX
        run: |
          mkdir -p release
          pnpm exec vsce package \
            --no-dependencies \
            --out release/portal-tunnel.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: portal-tunnel-vsix
          path: extensions/vscode/release/portal-tunnel.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish extension
    if: startsWith(github.ref, 'refs/tags/extension-v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: portal-tunnel-vsix
          path: extensions/vscode/release

      - name: Publish to Visual Studio Marketplace
        run: |
          pnpm exec vsce publish \
            --packagePath release/portal-tunnel.vsix \
            --skip-duplicate \
            --oidc
