name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download dependencies
        run: go mod download

      - name: Install CI tools
        run: make install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Go checks
        run: |
          make vet
          make lint
          make test

      - name: Run frontend checks
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build
