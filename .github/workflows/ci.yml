name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      go: >-
        ${{ github.event_name == 'workflow_dispatch' ||
        steps.filter.outputs.backend == 'true' ||
        steps.filter.outputs.appauth == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      charts: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.charts == 'true' }}
    steps:
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect changed inputs
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            # Keep unknown paths and embedded runtime assets in backend checks.
            backend:
              - '**'
              - '!frontend/**'
              - '!docs/**'
              - '!extensions/**'
              - '!*.md'
            # Shared JSON fixtures are also inputs to sdk/appauth's Go tests.
            appauth:
              - 'frontend/src/lib/*.json'
            frontend:
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            charts:
              - 'docs/examples/helm/**'
              - 'docs/static/examples/kubernetes/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  verify:
    name: Verify
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require successful change detection
        env:
          CHANGE_DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_DETECTION_RESULT" = success

      - name: Checkout code
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.frontend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        if: needs.changes.outputs.go == 'true'
        id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go module consistency
        if: needs.changes.outputs.go == 'true'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Cache CI linter
        if: needs.changes.outputs.go == 'true'
        id: cache-tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-lint-${{ hashFiles('Makefile') }}

      - name: Install CI linter
        if: needs.changes.outputs.go == 'true' && steps.cache-tools.outputs.cache-hit != 'true'
        run: make install-lint

      - name: Run Go checks
        if: needs.changes.outputs.go == 'true'
        run: |
          make vet
          make lint
          make test-go-unit

      - name: Set up Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Run frontend checks
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm test
          npm run lint
          npm run build

  e2e:
    name: E2E Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile browser tunnel WASM
        run: make build-wasm

      # The full Linux suite includes TestPortalExposeStdinLifetime.
      - name: Run E2E tests
        run: make test-e2e

  charts:
    name: Helm Charts
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Helm is preinstalled on GitHub-hosted Ubuntu runners.
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Lint charts and validate Kubernetes examples
        run: make check-charts

  tunnel-image:
    name: Build Tunnel Image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build tunnel image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: cmd/portal-tunnel/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=portal-tunnel-ci
          cache-to: type=gha,mode=max,scope=portal-tunnel-ci

  expose-stdin-lifetime:
    name: Expose stdin lifetime (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    # GitHub-hosted macOS queue wait (up to hours) sets the CI wall; Depot's
    # macOS runner proves the same native behavior. Matrix values — and so the
    # check names — stay unchanged; only the macOS cell's runner moves.
    # Windows keeps windows-latest: its queue is consistently near zero.
    runs-on: ${{ matrix.os == 'macos-latest' && 'depot-macos-latest' || matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test application-owned expose lifetime
        run: go test -count=1 -timeout=10m ./e2e -run '^TestPortalExposeStdinLifetime$'

      - name: Test protected agent state and identities
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.go.outcome == 'success' }}
        run: go test -count=1 ./utils ./portal/identity ./cmd/portal-tunnel/agent
