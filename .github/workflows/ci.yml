name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download dependencies
        run: go mod download

      - name: Install CI tools
        run: make install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Make checks
        run: |
          make vet
          make lint
          make test

      - name: Run frontend checks
        working-directory: frontend
        run: |
          npm run lint
          npm run build

  tunnel-image:
    name: Build Tunnel Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-architecture tunnel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/portal-tunnel/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=portal-tunnel
          cache-to: type=gha,mode=max,scope=portal-tunnel
