{{- if and (eq (include "portal-tunnel.persistent" .) "true") (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "portal-tunnel.fullname" . }}
  labels:
    {{- include "portal-tunnel.labels" . | nindent 4 }}
  annotations:
    # Keeps the tunnel identity, and so its URL, after helm uninstall.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
