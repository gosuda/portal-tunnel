{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portal-tunnel.fullname" . }}
  labels:
    {{- include "portal-tunnel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secretEnv }}
  {{ $name }}: {{ toString $value | quote }}
  {{- end }}
{{- end }}
