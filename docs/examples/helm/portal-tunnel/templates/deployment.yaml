{{- include "portal-tunnel.validate" . }}
{{- $persistent := eq (include "portal-tunnel.persistent" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portal-tunnel.fullname" . }}
  labels:
    {{- include "portal-tunnel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if $persistent }}
  # One ReadWriteOnce volume holds the identity.
  strategy:
    type: Recreate
  {{- else }}
  # A client registers with its relays a few seconds after it starts and has
  # no readiness check for that. Waiting 10 seconds before a new pod counts as
  # available lets it register before an old one stops: it joins the URL in
  # replica mode, or takes the lease over from a single client.
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
  {{- end }}
  selector:
    matchLabels:
      {{- include "portal-tunnel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "portal-tunnel.selectorLabels" . | nindent 8 }}
      {{- if or .Values.secretEnv .Values.podAnnotations }}
      annotations:
        {{- if .Values.secretEnv }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tunnel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - expose
            {{- with .Values.name }}
            - --name
            - {{ . | quote }}
            {{- end }}
            {{- with .Values.relays }}
            - --relays
            - {{ join "," . | quote }}
            {{- end }}
            {{- if gt (int .Values.replicaCount) 1 }}
            - --replica
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-addr
            - {{ printf ":%d" (int .Values.metrics.port) | quote }}
            {{- end }}
            {{- range .Values.args }}
            - {{ . | quote }}
            {{- end }}
            {{- with .Values.target }}
            - {{ . | quote }}
            {{- end }}
          {{- if or .Values.identity.existingSecret .Values.env }}
          env:
            {{- with .Values.identity.existingSecret }}
            - name: IDENTITY_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.identity.key }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ toString $value | quote }}
            {{- end }}
          {{- end }}
          {{- if or .Values.secretEnv .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ include "portal-tunnel.secretName" . }}
          {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 20
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The image keeps IDENTITY_PATH here, and it is the working directory.
            - name: identity
              mountPath: /identity
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: identity
          {{- if $persistent }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "portal-tunnel.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
