# Dedicated customer TCP entry point for /relay-replacement.
# Requires nginx with the stream module loaded; use separate Portal processes
# on :8443 (old) and :9443 (new). Control connections bypass this nginx instance.
worker_processes auto;
worker_shutdown_timeout 10m;

events {
    worker_connections 4096;
}

stream {
    log_format relay '$pid $remote_addr $upstream_addr $status $session_time';
    access_log /var/log/nginx/relay-sessions.log relay;

    server {
        listen 443;
        # Add an IPv6 listener when the public hostname also has an AAAA record.
        # listen [::]:443;

        # After every tunnel is ready, change to :9443 and gracefully reload.
        proxy_pass 127.0.0.1:8443;
        proxy_connect_timeout 5s;
        proxy_timeout 24h; # Inactivity timeout, not the drain deadline.
        proxy_half_close on;
        # No TLS termination and no PROXY protocol header toward Portal.
    }
}
