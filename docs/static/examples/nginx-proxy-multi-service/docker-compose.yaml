# Portal relay under a subdomain behind an existing public nginx.
#
# This example runs the Portal stack for portal.example.com while an existing
# external nginx owns public :80/:443 and other sibling subdomains.
#
# External nginx responsibility:
#   - Route portal.example.com and *.portal.example.com with stream/ssl_preread
#     to 127.0.0.1:${PORTAL_EDGE_PORT:-9443} without TLS termination.
#   - Keep ordinary HTTP/TLS routing for the rest of your services in your own
#     nginx template.
#
# Portal edge responsibility:
#   - portal-nginx uses the repository-level nginx.conf.template.
#   - portal.example.com is TLS-terminated and routed to Portal UI/API services.
#   - *.portal.example.com is raw TCP passthrough to the portal SNI listener.
#
# Prerequisites:
#   1. Copy .env.example to .env and set all required values.
#   2. Copy the repository-level nginx.conf.template next to this file:
#        cp <repo>/nginx.conf.template ./nginx.conf.template
#   3. Place the Portal relay certificate in ./.portal-certs/:
#        - fullchain.pem covers portal.example.com and *.portal.example.com
#        - privatekey.pem matches fullchain.pem
#      portal-nginx and portal intentionally share this pair. Tunnel TLS uses
#      the portal keyless signer, so mismatched keys cause
#      ERR_SSL_PROTOCOL_ERROR / TLS bad signature failures.
#   4. Create the .portal-certs directory with correct ownership (UID 65532 = nonroot):
#        mkdir -p ./.portal-certs/frontend-state
#        sudo chown 65532:65532 ./.portal-certs
#        chmod 755 ./.portal-certs
#   5. Start Portal:
#        docker compose up -d

services:
  portal-nginx:
    image: nginx:stable-alpine
    container_name: portal-nginx
    ports:
      - "127.0.0.1:${PORTAL_EDGE_PORT:-9443}:443"
    environment:
      PORTAL_URL: ${PORTAL_URL:-https://portal.example.com}
      NGINX_CERT_FILE: ${NGINX_CERT_FILE:-/etc/nginx/certs/fullchain.pem}
      NGINX_CERT_KEY: ${NGINX_CERT_KEY:-/etc/nginx/certs/privatekey.pem}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./.portal-certs:/etc/nginx/certs:ro
    depends_on:
      - portal
      - portal-frontend
      - portal-api
    command:
      - /bin/sh
      - -c
      - |
        portal_host="$${PORTAL_URL#*://}"
        portal_host="$${portal_host%%/*}"
        portal_host="$${portal_host%%:*}"
        export PORTAL_HOST="$${portal_host:-localhost}"

        export NGINX_CERT_FILE="$${NGINX_CERT_FILE:-/etc/nginx/certs/fullchain.pem}"
        export NGINX_CERT_KEY="$${NGINX_CERT_KEY:-/etc/nginx/certs/privatekey.pem}"
        envsubst '$$PORTAL_HOST $$NGINX_CERT_FILE $$NGINX_CERT_KEY' \
          < /etc/nginx/templates/nginx.conf.template \
          > /etc/nginx/nginx.conf

        until [ -s "$$NGINX_CERT_FILE" ] && [ -s "$$NGINX_CERT_KEY" ]; do
          echo "waiting for Portal TLS certificate files"
          sleep 1
        done
        exec nginx -g 'daemon off;'
    restart: unless-stopped

  # Optional: uncomment to enable auto-generated thumbnails for tunnel apps.
  # See docs/src/routes/deployment/+page.md for details.
  # headless-shell:
  #   image: chromedp/headless-shell:stable
  #   restart: unless-stopped

  portal:
    image: ghcr.io/gosuda/portal:2
    container_name: portal
    ports:
      - "${WIREGUARD_PORT:-51820}:${WIREGUARD_PORT:-51820}/udp"
      # Uncomment when enabling UDP transport:
      # - "${SNI_PORT:-443}:${SNI_PORT:-443}/udp"
      # - "${MIN_PORT:-40000}-${MAX_PORT:-40009}:${MIN_PORT:-40000}-${MAX_PORT:-40009}/udp"
      # Uncomment when enabling raw TCP port transport:
      # - "${MIN_PORT:-40000}-${MAX_PORT:-40009}:${MIN_PORT:-40000}-${MAX_PORT:-40009}"
    stop_grace_period: 30s
    environment:
      PORTAL_URL: ${PORTAL_URL:-https://portal.example.com}
      BOOTSTRAPS: ${BOOTSTRAPS:-}
      DISCOVERY: ${DISCOVERY:-true}
      WIREGUARD_PORT: ${WIREGUARD_PORT:-51820}
      API_PORT: ${API_PORT:-4017}
      SNI_PORT: ${SNI_PORT:-443}
      IDENTITY_PATH: ${IDENTITY_PATH:-/portal-certs}
      MIN_PORT: ${MIN_PORT:-0}
      MAX_PORT: ${MAX_PORT:-0}
      UDP_ENABLED: ${UDP_ENABLED:-false}
      TCP_ENABLED: ${TCP_ENABLED:-false}
      ADMIN_WALLETS: ${ADMIN_WALLETS:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      ACME_DNS_PROVIDER: ${ACME_DNS_PROVIDER:-}
      ENS_GASLESS_ENABLED: ${ENS_GASLESS_ENABLED:-false}
      CLOUDFLARE_TOKEN: ${CLOUDFLARE_TOKEN:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_MANAGED_ZONE: ${GCP_MANAGED_ZONE:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID:-}
      AWS_DNSSEC_KMS_KEY_ARN: ${AWS_DNSSEC_KMS_KEY_ARN:-}
      VULTR_API_KEY: ${VULTR_API_KEY:-}
      NJALLA_TOKEN: ${NJALLA_TOKEN:-}
    volumes:
      - ./.portal-certs:${IDENTITY_PATH:-/portal-certs}
      # Uncomment when using a Google Cloud service account file for gcloud automation.
      # - ./gcp-dns.json:/run/secrets/gcp-dns.json:ro
    restart: unless-stopped

  portal-frontend:
    image: ghcr.io/gosuda/portal-frontend:2
    container_name: portal-frontend
    depends_on:
      - portal
      - portal-api
    restart: unless-stopped

  portal-api:
    image: ghcr.io/gosuda/portal-api:2
    container_name: portal-api
    depends_on:
      - portal
      # Uncomment with the headless-shell service above to enable generated screenshots.
      # - headless-shell
    environment:
      PORT: 8081
      PORTAL_API_BASE_URL: "https://portal:${API_PORT:-4017}"
      LANDING_PAGE_ENABLED: ${LANDING_PAGE_ENABLED:-false}
      PORTAL_FRONTEND_STATE_PATH: /frontend-state/state.json
      HEADLESS_SHELL_URL: ${HEADLESS_SHELL_URL:-}
      # HEADLESS_SHELL_URL: ${HEADLESS_SHELL_URL:-ws://headless-shell:9222}
    volumes:
      - ./.portal-certs/frontend-state:/frontend-state
    restart: unless-stopped
