# Portal behind an nginx that already owns :443.
#
# Portal cannot share that port. Its SNI router closes any hostname it has no
# lease for, so putting it on a socket that also serves other sites would drop
# every request meant for them. nginx keeps the port and hands Portal the
# hostnames that belong to it.
#
# TOPOLOGY: nginx runs as a container beside Portal on the same Compose network.
# Only nginx publishes host ports; Portal publishes no TCP port at all and is
# reached as `portal:443` / `portal:4017` over that network. The 127.0.0.1
# addresses below are inside this container and never appear on the host. See
# compose.override.yaml beside this file.
#
# Substitute portal.example.com with PORTAL_URL's host. Nothing else needs
# editing for the default (pass-through) mode.

events {
    worker_connections 4096;
}

stream {
    # Docker's embedded DNS. Upstreams are reached through variables plus a
    # resolver rather than static upstream blocks: a static name is resolved
    # once at boot and cached, so nginx would refuse to start while Portal is
    # down and would hold a stale address after the container is recreated.
    resolver 127.0.0.11 ipv6=off valid=10s;

    map $ssl_preread_server_name $portal_backend {
        # REQUIRED. Without it a `map` compares keys as literal strings and
        # `*.portal.example.com` never matches anything, so every lease
        # hostname silently falls through to `default`.
        hostnames;

        # Lease hostnames pass through untouched. Terminating TLS for them
        # breaks tunnels: clients started with --ban-mitm probe for exactly
        # that and drop the relay when they find it, and it disables keyless
        # TLS and Encrypted Client Hello, which need the handshake to reach
        # Portal.
        *.portal.example.com  127.0.0.1:8444;

        # The relay's own hostname. Pass-through by default -- see "TERMINATING
        # THE ROOT HOST" at the bottom before changing this to 127.0.0.1:8443.
        portal.example.com    127.0.0.1:8444;

        # Everything else this box already served, terminated by the http block.
        default               127.0.0.1:8443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $portal_backend;

        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        # Tunnels are long-lived. The 10 minute default cuts idle sessions.
        proxy_timeout 86400s;

        # Carry the client address across the loopback hop. Both destinations
        # below consume this header; Portal never sees it.
        proxy_protocol on;
    }

    # Portal's SNI listener, reached through a stage that strips the PROXY
    # header first.
    #
    # This stage is not optional. proxy_protocol is a server-level directive,
    # so the listener above sends the header to every destination it selects.
    # Portal does not parse the PROXY protocol: it would read "PROXY TCP4 ..."
    # where it expects a TLS ClientHello and close the connection, breaking
    # every wildcard tunnel. `listen ... proxy_protocol` consumes the header
    # here, and the absence of `proxy_protocol on` in this server means plain
    # TLS goes on to Portal.
    server {
        listen 127.0.0.1:8444 proxy_protocol;

        # Through a variable, for the same reason as the resolver above: a
        # literal `proxy_pass portal:443` is resolved once at boot, so nginx
        # refuses to start while Portal is down.
        set $portal_sni portal:443;
        proxy_pass $portal_sni;

        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_timeout 86400s;
    }
}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Recover the real client address from the PROXY header. Trust only the
    # loopback hop, which is the stream listener in this same container.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Other sites this box serves. proxy_protocol is a listen-socket option, so
    # every server block on 8443 receives the header and $remote_addr is the
    # real client for all of them.
    include /etc/nginx/sites-enabled/*.conf;

    server {
        listen 80;
        server_name _;

        # ACME HTTP-01 for any domain terminated by this edge. Non-wildcard
        # names need no DNS API credentials, so this works with any registrar.
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# TERMINATING THE ROOT HOST
#
# Passing the root host through leaves Portal with no client address: it reads
# X-Forwarded-For and X-Real-IP only, and a pass-through carries no HTTP layer
# to put them in. /api/policy/ips and rate limiting therefore see the tunnel
# ingress rather than the visitor.
#
# Terminating the root host here recovers that, at a cost that has to be checked
# first:
#
#   Portal publishes an HTTPS record carrying `ech=` for its own hostname
#   whenever a DNS provider is configured, and installs the matching key only on
#   its own API listener (portal/server.go prepareAPITLS). nginx has neither.
#   ECH-capable clients that read the record can then fail the connection before
#   any request arrives. SyncECHConfig is a no-op without a DNS provider, so
#   terminating here is only safe when ACME_DNS_PROVIDER is empty and the
#   certificate is supplied manually.
#
# If that holds, point the root host at the http listener:
#
#     portal.example.com  127.0.0.1:8443;
#
# and add this server block. Note X-Forwarded-For: $remote_addr, not
# $proxy_add_x_forwarded_for. This is a public trust boundary, and the appending
# form keeps whatever the visitor sent. Portal trusts the FIRST entry, so
# "X-Forwarded-For: 10.0.0.9" from the Internet would arrive as
# "10.0.0.9, <real>" and be read as 10.0.0.9 -- an /api/policy/ips bypass.
# $remote_addr has already been restored from the PROXY header above.
#
#     server {
#         listen 8443 ssl proxy_protocol;
#         server_name portal.example.com;
#         server_tokens off;
#
#         ssl_certificate     /etc/nginx/certs/fullchain.pem;
#         ssl_certificate_key /etc/nginx/certs/privatekey.pem;
#         ssl_protocols TLSv1.2 TLSv1.3;
#
#         # Portal's API listener speaks TLS with the relay certificate, which
#         # is not the browser-facing one, so it is not verified here.
#         set $portal https://portal:4017;
#
#         location = /sdk/connect {
#             proxy_pass $portal;
#             proxy_ssl_verify off;
#             proxy_ssl_server_name on;
#             proxy_set_header Host              $host;
#             proxy_set_header X-Real-IP         $remote_addr;
#             proxy_set_header X-Forwarded-For   $remote_addr;
#             proxy_set_header X-Forwarded-Proto https;
#
#             proxy_http_version 1.1;
#             proxy_set_header Upgrade    $http_upgrade;
#             # $connection_upgrade, not $http_connection: a client may send
#             # "keep-alive, Upgrade" and forwarding that verbatim fails the
#             # upgrade.
#             proxy_set_header Connection $connection_upgrade;
#
#             proxy_buffering         off;
#             proxy_request_buffering off;
#             proxy_read_timeout      86400s;
#             proxy_send_timeout      86400s;
#         }
#
#         location / {
#             proxy_pass $portal;
#             proxy_ssl_verify off;
#             proxy_ssl_server_name on;
#             proxy_set_header Host              $host;
#             proxy_set_header X-Real-IP         $remote_addr;
#             proxy_set_header X-Forwarded-For   $remote_addr;
#             proxy_set_header X-Forwarded-Proto https;
#         }
#     }
#
# Then set TRUST_PROXY_HEADERS=true and TRUSTED_PROXY_CIDRS=172.31.240.2/32,
# the fixed address compose.override.yaml pins this container to. Not the
# default private ranges, which would trust every container on the host, and
# not whatever address Compose happens to assign: that changes when the
# container is recreated, and Portal would then quietly attribute every visitor
# to nginx.
