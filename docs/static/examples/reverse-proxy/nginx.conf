# Portal behind a containerised nginx that owns public :443.
# See the deployment guide for topology, ECH, and trust-boundary rationale.
# Replace portal.example.com with PORTAL_URL's host.

events {
    worker_connections 4096;
}

stream {
    # Resolve Compose service names again after container recreation.
    resolver 127.0.0.11 ipv6=off valid=10s;

    map $ssl_preread_server_name $portal_backend {
        # Required for *.portal.example.com to be treated as a hostname mask.
        hostnames;

        # Lease TLS must reach Portal untouched.
        *.portal.example.com  127.0.0.1:8444;

        # Pass the root host through by default; see ROOT HOST TERMINATION below.
        portal.example.com    127.0.0.1:8444;

        # Existing sites terminate in this nginx.
        default               127.0.0.1:8443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $portal_backend;

        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_timeout 86400s;

        # The selected local listener consumes this header before forwarding.
        proxy_protocol on;
    }

    # Strip PROXY protocol before Portal, which expects a TLS ClientHello first.
    server {
        listen 127.0.0.1:8444 proxy_protocol;

        set $portal_sni portal:443;
        proxy_pass $portal_sni;

        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_timeout 86400s;
    }
}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Recover the address carried across the stream -> http loopback hop.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Server blocks included here listen on 8443 and receive PROXY protocol.
    include /etc/nginx/sites-enabled/*.conf;

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}

