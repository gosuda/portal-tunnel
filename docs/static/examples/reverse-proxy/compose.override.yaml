# Port arrangement for running Portal behind a containerised nginx.
#
# Save as docker-compose.override.yml next to the bundled docker-compose.yml.
# Compose loads that name automatically.
#
# Only nginx publishes host ports. Portal keeps its TCP listeners on the Compose
# network, where nginx reaches them as portal:443 and portal:4017, so nothing
# competes for :443 on the host and no loopback mapping is needed.
#
# SNI_PORT stays 443 inside the container. Portal reaches its own API listener
# through its SNI router, and that port is what goes into the ECH HTTPS record.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sites-enabled:/etc/nginx/sites-enabled:ro
      - ./certs:/etc/nginx/certs:ro
      - acme-webroot:/var/www/acme
    restart: unless-stopped

  portal:
    # !override replaces the base ports list instead of appending to it.
    # Without it Compose merges both entries and still tries to bind :443.
    # Requires Docker Compose 2.24.4 or newer; check with `docker compose version`.
    #
    # This list must carry EVERY mapping the deployment had enabled. The base
    # file publishes TCP 443 and the WireGuard port, and comments out three more
    # that a deployment may have turned on. Replacing the list drops anything
    # left out, silently, and existing tunnels stop working.
    ports: !override
      - "${WIREGUARD_PORT:-51820}:${WIREGUARD_PORT:-51820}/udp"
      # TCP 443 is deliberately absent: nginx owns it, and Portal is reached
      # over the Compose network instead.
      #
      # Uncomment whichever of these the deployment already had enabled.
      # - "443:443/udp"
      # - "${MIN_PORT:-40000}-${MAX_PORT:-40009}:${MIN_PORT:-40000}-${MAX_PORT:-40009}/udp"
      # - "${MIN_PORT:-40000}-${MAX_PORT:-40009}:${MIN_PORT:-40000}-${MAX_PORT:-40009}"
      # - "${PPROF_PORT:-6060}:${PPROF_PORT:-6060}"

volumes:
  acme-webroot: {}
