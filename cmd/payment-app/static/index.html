<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>{{.PageTitle}}</title>
    <meta name="description" content="{{.PageDescription}}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{.PageTitle}}">
    <meta property="og:description" content="{{.PageDescription}}">
    <meta property="og:image" content="{{.OGImage}}">
    <meta property="og:url" content="{{.URL}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{.PageTitle}}">
    <meta name="twitter:description" content="{{.PageDescription}}">
    <meta name="twitter:image" content="{{.OGImage}}">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main class="shell">
        <section class="app-surface" aria-label="Payment app">
            <div class="summary">
                <div class="kicker">
                    <span>{{.PaymentRailName}}</span>
                    <span>{{.NetworkName}}</span>
                </div>
                <h1>{{.Headline}}</h1>
                <p class="lede">{{.Lede}}</p>

                <dl class="facts">
                    <div>
                        <dt>Amount</dt>
                        <dd>{{.Price}}</dd>
                    </div>
                    <div>
                        <dt>Asset</dt>
                        <dd>{{.AssetLabel}}</dd>
                    </div>
                    <div>
                        <dt>{{.NetworkLabel}}</dt>
                        <dd>{{.NetworkName}}</dd>
                    </div>
                    <div>
                        <dt>{{.RecipientLabel}}</dt>
                        <dd>{{.RecipientAddress}}</dd>
                    </div>
                </dl>

                <div class="actions">
                    <button id="unlockButton" class="primary-button" type="button" data-protected-path="{{.ProtectedPath}}" data-checkout-title="{{.CheckoutTitle}}" data-status-open="{{.StatusOpen}}" data-status-paused="{{.StatusPaused}}" data-preview-title="{{.PreviewTitle}}">
                        {{.ButtonLabel}}
                    </button>
                    <span id="status" class="status">{{.StatusReady}}</span>
                </div>
            </div>

            <div id="viewer" class="preview" aria-label="Protected image viewer">
                <div class="preview-topbar">
                    <div class="window-controls" aria-hidden="true">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <span id="viewerTitle" class="viewer-title">{{.PreviewTitle}}</span>
                    <button id="resetViewer" class="viewer-reset" type="button" hidden>Reset</button>
                </div>
                <div id="lockedPreview" class="preview-body">
                    <div class="lock-mark">{{.LockedMark}}</div>
                    <div>
                        <p class="preview-label">{{.PreviewLabel}}</p>
                        <p class="preview-title">{{.PreviewMessage}}</p>
                    </div>
                </div>
                <iframe id="paymentFrame" class="payment-frame" title="{{.CheckoutTitle}}" allow="clipboard-read; clipboard-write; payment; publickey-credentials-get" hidden></iframe>
            </div>
        </section>
    </main>

    <script>
        const unlockButton = document.getElementById('unlockButton');
        const viewer = document.getElementById('viewer');
        const lockedPreview = document.getElementById('lockedPreview');
        const paymentFrame = document.getElementById('paymentFrame');
        const resetViewer = document.getElementById('resetViewer');
        const viewerTitle = document.getElementById('viewerTitle');
        const statusEl = document.getElementById('status');

        unlockButton.addEventListener('click', () => {
            viewer.classList.add('is-active');
            lockedPreview.hidden = true;
            paymentFrame.hidden = false;
            resetViewer.hidden = false;
            viewerTitle.textContent = unlockButton.dataset.checkoutTitle;
            statusEl.textContent = unlockButton.dataset.statusOpen;
            if (!paymentFrame.src) {
                paymentFrame.src = unlockButton.dataset.protectedPath;
            }
        });

        resetViewer.addEventListener('click', () => {
            viewer.classList.remove('is-active');
            lockedPreview.hidden = false;
            paymentFrame.hidden = true;
            resetViewer.hidden = true;
            viewerTitle.textContent = unlockButton.dataset.previewTitle;
            statusEl.textContent = paymentFrame.src ? unlockButton.dataset.statusPaused : statusEl.textContent;
        });
    </script>
</body>

</html>
