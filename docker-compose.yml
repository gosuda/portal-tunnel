services:
  # Optional: uncomment to enable auto-generated thumbnails for tunnel apps.
  # See docs/deployment.md section 8 for details.
  # headless-shell:
  #   image: chromedp/headless-shell:stable
  #   restart: unless-stopped

  portal:
    build: .
    image: ghcr.io/gosuda/portal:latest
    restart: unless-stopped
    ports:
      - "4017:4017"
      - "443:443"
    environment:
      PORTAL_URL: ${PORTAL_URL}
      BOOTSTRAPS: ${BOOTSTRAPS}
      DISCOVERY: ${DISCOVERY}
      IDENTITY_PATH: /portal-certs/identity.json

      API_PORT: ${API_PORT}
      SNI_PORT: ${SNI_PORT}

      MIN_PORT: ${MIN_PORT}
      MAX_PORT: ${MAX_PORT}
      UDP_ENABLED: ${UDP_ENABLED}
      TCP_ENABLED: ${TCP_ENABLED}

      KEYLESS_DIR: ${KEYLESS_DIR}
      ACME_DNS_PROVIDER: ${ACME_DNS_PROVIDER}
      CLOUDFLARE_TOKEN: ${CLOUDFLARE_TOKEN}

      ENS_GASLESS_ENABLED: ${ENS_GASLESS_ENABLED}

      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
      LANDING_PAGE_ENABLED: ${LANDING_PAGE_ENABLED}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS}
    volumes:
      - /portal-certs:/portal-certs
